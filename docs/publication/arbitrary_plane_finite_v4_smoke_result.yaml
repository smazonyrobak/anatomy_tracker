  engineering_result: the finite S=9 cache-to-mixed-curriculum training, authenticated atomic checkpoint/report ledger, resumable load, and capability-bound export path completed successfully
  quality_result: failed and not established; hardened all-row postrun evaluated all 12 animal-disjoint internal-development rows, but every row failed and animal-macro top-k recall was zero
