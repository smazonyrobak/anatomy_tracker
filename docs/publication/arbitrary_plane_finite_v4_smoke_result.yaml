  optimization_caveat: eight AMP overflow attempts were safely skipped, but the 65536 initial scale is inefficient for the next bounded run
  next_gate: improve honest coarse retrieval and train a new receipt-bound finite S=9 pilot; require nonzero animal-disjoint top-k recall and materially improved physical pose/overlap metrics with complete raw predictions before calibration or any public benchmark
