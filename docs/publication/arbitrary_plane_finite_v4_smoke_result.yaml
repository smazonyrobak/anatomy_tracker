  metric_caveat: the two-animal internal-development smoke has 11.670 mm animal-macro landmark error, 3.592 mm absolute plane-offset error, 57.036 degree projective-normal error, 129.527 degree finite-frame error, and 0.000635 mean foreground Dice; these are failure-localization metrics, not validation estimates
