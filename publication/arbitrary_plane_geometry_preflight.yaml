  vertical_discrete_flip: "O'=O+((H-1)/H)V; V'=-V"
  physical_voxel_center: "origin_um+(index+0.5)*voxel_size_um"
  manifest_stage: "plane-only precursor"
  complete_synthetic_realization_id_issued: false
