schema_version: "1.0"
protocol_version: "0.1.0"
status: "arbitrary_plane_geometry_revision_in_progress"
created_date: "2026-08-17"
baseline:
  repository_commit: "c6681039e0b7acf35c9cdbee43040a3dca29cdab"
  short_commit: "c668103"
  branch: "codex/joint-registration"
  immutable_ledger: "docs/publication/BASELINE_LEDGER.md"
study:
  title: "Joint arbitrary-plane atlas localization and nonlinear registration of mouse-brain histology"
  objective: >-
    Determine whether one jointly trained model improves full arbitrary-plane CCF geometry,
    local anatomical correspondence, compatibility-derived failure ranking, and downstream probe mapping
    over frozen internal and published alternatives while remaining practical in the desktop GUI.
  model_status: "arbitrary_plane_geometry_and_manifest_prototype_active_not_qualified"
  intended_scope:
    species: "Mus musculus"
    anatomy: "whole adult brain"
    section_plane: "any brain-intersecting plane"
    image_channels: "grayscale"
    atlas: "Allen CCFv3 25 um"
  excluded_claims:
    - "clinical or diagnostic use"
    - "arbitrary-plane or partial-field performance before dedicated new qualification"
    - "market-wide superiority before every applicable locked comparator passes reproduction"
model:
  unit: "single jointly trained checkpoint"
  components:
    geometry_appropriate_pose_and_registration_encoders: true
    shared_recurrent_review_core: "candidate only after arbitrary-plane premise passes"
    explicit_global_pose_head: true
    explicit_similarity_head: true
    stationary_velocity_dense_head: true
    forward_and_inverse_maps: true
    trained_compatibility_energy: true
    recurrent_shared_refinement: "prespecified ablation, not yet selected"
  deployment:
    checkpoint_count: 1
    onnx_entry_graphs: 3
    entry_graph_roles: ["source_initializer_encoder", "cached_coarse_candidate_scorer", "final_dense_refiner"]
    host_atlas_renderer_between_iterations: true
    rationale: "Preserve the large 3-D atlas outside ONNX while exporting all three entry graphs from one jointly trained checkpoint."
  initial_iterations: "three is a hypothesis; feed-forward versus recurrent depth is selected later"
  iteration_selection: "development accuracy-latency ablation"
  public_pose_outputs:
    - "quicknii_ouv_ml_ap_dv"
    - "structured_ccf_frame_center_rotation6d_positive_triangular_basis"
    - "credible_spatial_plane_volume_after_calibration"
    - "derived_ap_lr_dv_only_when_coronal_conversion_is_well_conditioned"
  dense_outputs:
    - "fixed_atlas_to_moving_histology_absolute_xy_px"
    - "moving_histology_to_fixed_atlas_absolute_xy_px"
  safeguards:
    - "local field constrained against absorbing bulk affine pose"
    - "wrong-plane hard-negative ranking"
    - "pose scored before nonlinear deformation"
    - "inverse consistency and topology monitoring"
analysis_modes:
  - id: "automatic"
    information: "raw image only; automatic mask allowed and disclosed"
  - id: "outline_assisted"
    information: "optional smart-brush visible-tissue/surface mask; accurate, imperfect and absent-mask modes remain supported"
  - id: "constraint_assisted"
    information: "optional full-plane domain, stack-order/shared-normal or surgical information"
  - id: "expert_assisted"
    information: "manual QuickNII/VisuAlign or equivalent"
data:
  split_unit: "animal"
  experiment_role: "required provenance nested within animal; never a substitute split or inferential unit"
  unresolved_real_animal_id: "ineligible for confirmatory claims"
  descendant_split_inheritance: true
  sources:
    - id: "allen_ccfv3_25um"
      role: ["synthetic_pose", "synthetic_flow", "template", "labels"]
    - id: "allen_product5_s2p"
      role: ["historical_real_pose_supervision", "historical_real_appearance", "historical_development_selection"]
      standalone_arbitrary_plane_release_eligible: false
    - id: "allen_product8_slide_mounted"
      role: ["diagnostic_only"]
    - id: "deepslice_public_ground_truth"
      role: ["public_comparator_benchmark"]
      doi: "10.25949/22802411"
      leakage_status: "previously_inspected_not_pristine"
    - id: "local_session_722"
      role: ["workflow_diagnostic"]
      leakage_status: "previously_inspected_not_pristine"
  planned_hidden_real_pose:
    status: "not_collected"
    target_animals: "30-50"
    target_laboratories_minimum: 3
    target_sections: "500-1000"
    orientation_sampling: "deliberately include coronal, sagittal, horizontal and extreme-oblique animals"
    final_n_rule: "pilot-based power calculation frozen before final collection"
  planned_hidden_real_dense:
    status: "not_collected"
    target_animals_minimum: 20
    target_sections: "150-250"
    landmarks_per_section: "15-30 when identifiable"
synthetic_generator:
  generation: "on_demand_from_hashed_manifests"
  provenance:
    source_entity_type: "atlas"
    asset_identity_and_hash_required: true
    animal_id: null
    specimen_id: null
    experiment_id: null
    plane_realization_id_required: true
    synthetic_realization_id_required: "only after frame, basis, QuickNII O/U/V, deformation, appearance, mask and rendered artifacts are hash-bound"
    exact_rng_stream_and_rejection_attempt_required: true
  pose_domain:
    orientation: "uniform surface-area normal on RP2 plus uniform in-plane roll"
    offset: "uniform over the annotation-support projection for the sampled normal"
    support: "all brain-intersecting planes; named tiny-support/tangent stress strata retained"
    serialized_geometry: "QuickNII O/U/V"
    internal_geometry: "3-D centre plus continuous 6-D right-handed frame plus positive-diagonal upper-triangular 2x2 in-plane basis"
  nuisance:
    in_plane_rotation: "arbitrary"
    scale: [0.5, 1.5]
    translation: "bounded"
  deformation:
    representation: "positive-Jacobian stationary velocity with compound local components"
    missing_tissue_is_invalid_correspondence: true
  appearance:
    channels: 1
    proposed_severity_mix:
      clean: 0.10
      mild: 0.45
      moderate: 0.35
      severe: 0.10
    families:
      - "gain_offset_gamma_and_nonlinear_tone"
      - "nonblack_background_and_uneven_illumination"
      - "local_clipping_and_blowout"
      - "tiling_seams_and_vignette"
      - "noise_blur_streaks_scratches_and_specks"
      - "bubbles_tears_missing_tissue_and_occlusion"
  negative_pose_training:
    required: true
    includes_geodesic_normal_and_physical_offset_neighbours: true
    keeps_candidates_brain_intersecting: true
  locked_synthetic_test:
    independent_implementation_required: true
    new_seeds_alone_sufficient: false
training:
  release_training_data_policy: "Allen CCF-derived synthetic arbitrary-plane views only"
  historical_product5_mixed_real_training:
    status: "legacy_record_only"
    standalone_arbitrary_plane_release_eligible: false
  phases:
    - id: "freeze_and_generator_audit"
      views: 20000
      purpose: "contracts and premise tests; no performance claim"
    - id: "controlled_architecture_screen"
      views: "20000-50000"
      initialization: "random; no prior project or external vision weights"
      candidates:
        - "factorized_cnn_control"
        - "recurrent_local_correlation_convgru"
        - "windowed_cross_attention_after_export_preflight"
      matching: "same manifests, seeds, losses and recurrence; within 10 percent parameters, MACs and peak memory"
      purpose: "select a self-contained arbitrary-plane family, then test recurrence, feedback, hard-negative, and field-control ablations"
    - id: "multiseed_qualification"
      views: 100000
      seeds_minimum: 3
    - id: "evidence_based_scaling"
      views_maximum: 500000
      condition: "scale only while frozen validation endpoints improve"
  curriculum:
    - "exact or near-exact arbitrary-plane frame with mild warp"
    - "scheduled predicted poses and nearby hard negatives"
    - "fully closed-loop recurrent inference with full artifact mix"
  learned_checkpoint_dependencies:
    release_candidate: []
    legacy_seeded_runs: "development diagnostics only; never promotion eligible"
  model_selection_order:
    - "eligible_only_after_all_hard_gates"
    - "real_validation_landmark_tre_unique_anatomical_primary"
    - "secondary_pose_track_plane_distance"
    - "exact_synthetic_tail_and_correspondence"
    - "compatibility_risk_ranking"
    - "runtime_and_simplicity_within_equivalence_margin"
constraints:
  implemented_outside_model_weights: true
  families:
    plane_domain: "hard candidate mask in full O/U/V geometry"
    partial_order: "ordered signed offsets along a declared stack normal; legacy AP order preserved for converted coronal sessions"
    common_orientation: "shared frame normal plus per-slice signed offsets"
    surgical: "feasible 3-D O/U/V point and trajectory set from entry, angle, depth, probe geometry and observations"
  hard_constraint_satisfaction_required: 1.0
  infeasible_behavior: "return conflicts and minimum violation; never silently relax"
probabilistic_pose:
  status: "planned candidate; not yet implemented or calibrated"
  candidate_output: "equal-area antipodal normal distribution, conditional physical-offset candidates, and local tangent covariance over two normal rotations plus normal offset"
  current_covariance_dof: 3
  current_covariance_scope: "two plane-normal rotations plus physical normal offset only"
  full_finite_frame_uncertainty_represented: false
  deformation_uncertainty_represented: false
  downstream_confidence_propagation_allowed: false
  downstream_propagation_prerequisite: "full finite-frame plus deformation uncertainty represented and calibrated on held-out animals"
  adoption_rule: "retain only if training complexity remains proportionate and point-estimate accuracy is noninferior"
  calibration_data: "held-out animals only"
  point_accuracy_noninferiority_required: true
  required_reports:
    - "proper scoring rule"
    - "50/80/90/95 percent empirical coverage and interval width"
    - "risk-coverage and failure detection"
    - "probabilistic trajectory volume and brain-region assignment only after in-plane and dense-map uncertainty are represented and calibrated"
  gui_wording: "uncalibrated development energy is risk/compatibility, not confidence"
evaluation:
  tracks:
    - "published_deepslice_reproduction"
    - "new_hidden_multilab_real_pose"
    - "new_hidden_real_dense_registration"
    - "exact_out_of_generator_synthetic"
    - "downstream_probe_mapping"
    - "dedicated_real_cardinal_and_extreme_oblique_external_validation"
  comparison_modes:
    - "pose_only_before_warp"
    - "warp_only_at_common_exact_plane"
    - "complete_end_to_end"
  primary_anatomical_endpoint: "brain_level_median_landmark_tre_um"
  secondary_pose_track_metrics:
    - "brain_level_mean_physical_plane_distance_um"
    - "geodesic_normal_error"
    - "physical_offset_error"
    - "in_plane_frame_error"
  supporting_qualification_endpoints:
    - "visible_tissue_allen_id_correspondence_with_macro_dice_and_topology"
    - "recording_site_3d_ccf_error_and_hierarchy_region_accuracy"
statistics:
  inferential_unit: "animal"
  paired: true
  confidence_level: 0.95
  primary_method: "hierarchical_bootstrap_animals_then_slices"
  sensitivity_method: "mixed_effects_with_animal_and_laboratory_random_effects"
  secondary_multiplicity: "Holm within metric families"
  final_training_seeds_minimum: 3
  missing_and_failure_policy: "all attempted cases remain in denominator"
runtime:
  reference_hardware:
    os: "Windows 10 Pro 10.0.19045"
    cpu: "AMD Ryzen Threadripper 1900X, 8 cores / 16 threads"
    ram_gib: 63.9
    gpu: "NVIDIA GeForce RTX 2080 Ti"
    gpu_memory_mib: 11264
    nvidia_driver: "560.94"
  ten_slice_end_to_end_p95_seconds_maximum: 180
  cold_and_warm_reported: true
hidden_test:
  use_count: 1
  labels_held_by_third_party_preferred: true
  retraining_after_access_for_same_claim: false
documentation:
  narrative_protocol: "docs/publication/STUDY_PROTOCOL.md"
  architecture: "docs/publication/ARCHITECTURE.md"
  data_card: "DATA_CARD.md"
  model_card: "MODEL_CARD.md"
  reproducibility: "REPRODUCIBILITY.md"
  citations: "CITATIONS.bib"
  gates: "publication/gates.yaml"
  comparators: "publication/comparators.lock.yaml"
  data_lock: "publication/data.lock.yaml"
  exact_joint_test_contract: "publication/joint_test_contract.yaml"
  pretrained_initialization_lock: "publication/pretrained.lock.yaml"
  cold_start_architecture_screen: "publication/architecture_screen.yaml"
  deferred_validation_plan: "docs/publication/FUTURE_VALIDATION_PLAN.md"
