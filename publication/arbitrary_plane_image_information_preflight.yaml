atlas_intensity_contract:
  source: "Allen CCFv3 2017 25-um average template"
  source_path: "data/Allen Brain Atlas 25um/average_template_25.nrrd"
  source_sha256: "e4a2b483e842b4c8c1b5452d940ea59e14bc1ebaa38fe6a9c3bacac6db2a8f4b"
  support_annotation_sha256: "c620cbcc562183e4dcd40250d440130501781f74b41de35b1c1bdabace290c42"
  global_tissue_voxel_count: 32387385
  global_quantiles:
    mask: "raw Allen annotation nonzero"
    method: "numpy.quantile(method='linear')"
    probabilities: [0.005, 0.995]
    values: [6.0, 287.0]
  candidate_scaling: >-
    Render the raw float32 atlas volume to a float32 candidate raster first,
    promote that raster to float64, then compute
    clip((scalar-6.0)/281.0,0.0,1.0). Scaling the 3-D volume before trilinear
    rendering is forbidden because it is not numerically equivalent.
  target_scaling: >-
    Keep the generator's [0,1] float32 model_input_image and map through the
    frozen float32 dewarp, then promote the dewarped raster to float64. No
    per-image, per-case or per-candidate histogram fitting, histogram matching,
    adaptive contrast or learned normalization.

replay_and_rendering:
  ordinary_scalar_padding: 0.0
  target_dewarp: >-
    Call the frozen bilinear_sample_scalar on each descendant's float32
    model_input_image and float32 fixed_to_source_map with constant-zero
    padding, retain its float32 result exactly, then promote that result to
    float64 for descriptor calculation. This is source-to-fixed dewarping;
    using source_to_fixed_map or interpolating directly in float64 is an
    exact-control failure.
  bilinear_safe_map_domain: >-
    For each float32 fixed_to_source coordinate, set x0=floor(x), x1=x0+1,
    y0=floor(y), y1=y0+1 and require all four indexed corners unconditionally
    to be in bounds and true in source_map_domain_mask, then intersect
    fixed_map_domain_mask. This conservative target-only Boolean predicate
    guarantees that no invalid source corner enters a bilinear value, including
    the formally zero-weight second corner at an integral coordinate.
  bilinear_safe_visible_tissue: >-
    Intersect fixed_valid_correspondence_mask with the same exact four-corner
    predicate applied to source_valid_correspondence_mask.
  candidate_scalar_render: >-
    A new-file adapter may call the frozen prepared-context trusted renderer so
    the authenticated atlas tensor is loaded once. For every candidate, require
    the simultaneously rendered annotation and brain mask to equal the frozen
    candidate arrays and save a scalar-array receipt. Do not edit the frozen
    renderer merely to expose a new API.
  memory: >-
    Stream one base and one pending shuffled bank. Generate outline descendants
    one at a time. Never retain all 64 banks or all descendant arrays.

target_only_score_domains:
  visible:
    definition: "bilinear_safe_visible_tissue"
    role: "tissue and candidate-exterior mismatch reference"
  core:
    definition: >-
      Binary erosion of visible by the exact union of all MIND Gaussian-patch
      supports and their eight shifted copies, border_value=0.
    minimum_required_pixels: 128
    role: "internal-anatomy endpoint without outline/background support"
  context:
    definition: >-
      scipy.ndimage.distance_transform_edt(NOT visible,sampling=(p,p)) <=
      1000.0, intersected with binary_erosion(map_safe,structure=F,
      iterations=1,border_value=0,origin=0,brute_force=false). Distances are
      between pixel centres. The mask is identical for all candidates and
      outline modes.
    minimum_required_pixels: 512
    role: "oracle-mask-conditioned appearance endpoint with bounded exterior context"
  boundary_ring:
    definition: "context AND NOT visible"
    role: "descriptive background/outline-sensitivity ablation"
  fixed_denominator_rule: >-
    Candidate support never shrinks, crops or reweights a target domain.
    The gated descriptor-only scores never receive candidate annotation or
    support. They use the scaled trilinear scalar raster unchanged at every
    pixel, including pixels where the nearest-rendered annotation/support is
    false; they never multiply or zero it by candidate support. Any explicit
    support masking or penalty is confined to named secondary/null ablations.
    MIND+atlas-support never gates. The predeclared primary-versus-constant-null
    separation statistics are the only support-dependent gate comparisons; they
    compare complete landscapes and never alter a primary landscape or domain.

primary_descriptor:
  name: "masked physical 2-D MIND"
  numeric_dtype: "float64"
  input_contract: >-
    Target and 40 candidate intensity arrays, target visible/core/context masks,
    and target physical pixel pitch only. Candidate labels, brain-support masks,
    metadata and geometry are not arguments to the primary scorer.
  physical_parameters:
    search_displacement_um: 100.0
    gaussian_patch_sigma_um: 50.0
    gaussian_truncate_sigma: 3.0
  quantization:
    half_up_rule: "floor(positive_value+0.5)"
    axial_step_px: "A=max(1,floor(100/p+0.5))"
    diagonal_step_px: "B=max(1,floor(100/(sqrt(2)*p)+0.5))"
    gaussian_sigma_px: "50/p"
    gaussian_radius_px: "a=ceil(150/p)"
    offsets_dy_dx:
      - "(-A,0)"
      - "(A,0)"
      - "(0,-A)"
      - "(0,A)"
      - "(-B,-B)"
      - "(-B,B)"
      - "(B,-B)"
      - "(B,B)"
  patch_distance: >-
    Define (S_(dy,dx)J)[y,x]=J[y+dy,x+dx] when that source index is in bounds
    and the declared padding value otherwise. For i,j in [-a,a], construct the
    float64 square kernel K[i,j]=exp(-(i^2+j^2)/(2*(50/p)^2)), then divide by
    its float64 C-order sum. Compute Dr=scipy.ndimage.convolve(
    (J-Sr(J))^2,K,mode='constant',cval=0.0,origin=0).
    No separable filter, implicit radius or alternate summation is permitted.
  exact_footprint_and_erosion: >-
    Let R be exactly the eight ordered offsets listed above, L=R union {(0,0)},
    and F contain every offset (i+dy,j+dx) for
    i,j in [-a,a] and (dy,dx) in L. Store F as an odd Boolean array with radius
    a+max(A,B), with zero offset at its centre. Use scipy.ndimage.binary_erosion
    with structure=F, iterations=1, border_value=0, origin=0 and
    brute_force=false. This same operation defines core and erodes map-safe for
    context.
  local_variance: >-
    V is the arithmetic mean of the four axial Dr channels. Let vbar be mean V
    on the named target-only evaluation domain. Use that same domain separately
    for target and every candidate; no candidate mask is permitted. Clamp V to
    [max(1e-12,1e-3*vbar), max(the_lower_bound,1e3*vbar)].
  descriptor: >-
    mr=exp(-(Dr-min_s(Ds))/V_clamped). This makes the maximum channel exactly
    one. Preserve the canonical offset order above.
  pixel_loss: >-
    Mean squared difference across eight descriptor channels. No candidate
    annotation/support override is permitted in the gated primary.
  score: >-
    One minus mean pixel loss on the named target-only domain, clipped only for
    roundoff to [0,1]. Higher is better. Report core and context independently;
    absent-outline context is the primary oracle-mask-conditioned appearance
    endpoint.
  support_penalized_secondary_ablation: >-
    For native slots only, let the ordinary descriptor pixel loss on target
    domain D be l in [0,1], target visible mask T and candidate support Sk. Set
    l'=1 exactly on D AND T AND NOT Sk and l'=l elsewhere in D, then score
    1-mean_D(l'). Also save count(D AND T AND NOT Sk)/count(D AND T) for every
    candidate. Compute this outside the primary scorer. This explicitly measures
    support contribution; it never enters a gate.
  constant_within_support_null:
    construction: >-
      Outside the scorer, replace every candidate's scaled intensity on its
      verified annotation-derived brain support by that candidate's arithmetic
      mean supported intensity. Leave every pixel outside that support exactly
      equal to the primary candidate raster, including nonzero trilinear scalar
      values where the nearest-rendered annotation is zero. Leave the target
      unchanged, then call the identical descriptor-only scorer. This destroys
      internal supported texture without changing the primary's exterior; the
      support is used only to construct the null outside the scorer.
    shuffled_order: >-
      For shuffled bank i, flatten the already-scaled candidate on its support
      in the original bank-i lattice first, then apply the exact float64 common-
      lattice resampler to target j. Flattening after resampling is forbidden.
    role: >-
      Save all raw null landscapes. The absent-core separation gate below is
      required so a nominal MIND pass cannot be explained by candidate support
      shape alone.

secondary_descriptors:
  interpretation: >-
    Frozen diagnostics only. They never break a MIND tie, enter a weighted
    score, or rescue a failed MIND primary without a new preflight.
  HOG:
    resolution: "native 192x256 lattice"
    cell_width_um: 400.0
    cell_pixels: "q=max(4,floor(400/p+0.5))"
    gradients: >-
      On the native complete scaled raster, gx[y,x]=(J[y,x+1]-J[y,x-1])/(2p)
      and gy[y,x]=(J[y+1,x]-J[y-1,x])/(2p), with one scalar-image-padding pixel
      beyond each edge. No target or candidate mask enters feature construction.
    orientations: >-
      theta=mod(arctan2(gy,gx),pi), z=9*theta/pi, b0=floor(z), b1=(b0+1)
      modulo 9; magnitude hypot(gx,gy) votes weights 1-(z-b0) and z-b0.
    cells: >-
      Disjoint q-by-q cells anchored at the top/left: cell (r,c) owns vote-grid
      rows [r*q,(r+1)*q) and columns [c*q,(c+1)*q). Compute gradients and votes
      on the native raster first, then zero-pad only the magnitude/orientation
      vote grid on the bottom/right to complete cells. Never image-pad before
      gradient construction beyond the one derivative halo. Each native pixel
      votes its full magnitude into the two adjacent circular bins, linearly by
      angular distance; there is no spatial vote interpolation.
    blocks: >-
      Overlapping 2x2 cells with one-cell stride; concatenate cell row, cell
      column, then orientation bin into the canonical row-major 36-vector.
    normalization: >-
      Divide v by sqrt(sum(v^2)+1e-24), clip each component at 0.2, then divide
      by sqrt(sum(v_clipped^2)+1e-24), all in float64.
    score: >-
      For core and context, a block is eligible only when its complete unpadded
      2q-by-2q footprint and one-pixel gradient support lie in the named
      target-only domain. With db=min(1,0.5*||hT-hC||^2), score is one minus the
      unweighted mean db over eligible blocks. Candidate support never enters.
      For boundary-ring only, save a clearly named overlap-weighted contextual
      diagnostic using nb=the count of ring pixels in each block and
      1-sum(nb*db)/sum(nb) over nb>0; it may contain features from outside the
      ring and is not an isolated ring score. Boundary-ring blocks must also have
      their complete unpadded 2q-by-2q footprint and gradient support inside the
      native raster; partially vote-grid-padded edge blocks are ineligible. Save
      insufficient-domain nulls when no block is eligible.
  normalized_gradient_like:
    gaussian_sigma_um: 100.0
    gaussian_radius: "ceil(300/p) pixels"
    smoothing: >-
      scipy.ndimage.gaussian_filter on float64 with sigma=100/p, radius exactly
      ceil(300/p), mode='constant', cval=the scalar-image padding value and
      axes=(0,1); no implicit truncate or separable alternative is permitted.
    gradient: >-
      Let G be the declared smoothed image and r=ceil(300/p). Compute
      gx[y,x]=(G[y,x+1]-G[y,x-1])/(2p) and
      gy[y,x]=(G[y+1,x]-G[y-1,x])/(2p), using a one-pixel halo with the same
      scalar-image padding value. Additionally erode each named target-only
      domain with scipy.ndimage.binary_erosion using an all-true square of shape
      (2*(r+1)+1,2*(r+1)+1), iterations=1, border_value=0, origin=0 and
      brute_force=false.
    derived_evaluation_domain: >-
      Name the result ngf_domain(D). Use exactly ngf_domain(D), not the original
      D, both for target/candidate q95 stabilization and for the final similarity
      mean. If it is empty, emit the declared insufficient-domain record.
    stabilization: >-
      For target and each candidate separately, eta=max(1e-12,0.1*q95 of
      gradient magnitude on the same named target-only evaluation domain), with
      numpy.quantile(method='linear'); no candidate mask enters.
    polarity_invariant_similarity: >-
      ((abs(gT dot gC)+etaT*etaC)^2) /
      ((||gT||^2+etaT^2)*(||gC||^2+etaC^2))
    score: >-
      Mean similarity on the fixed target domain, clipped to [0,1] only for
      floating-point roundoff. Candidate support is not supplied. This is an
      NGF-motivated engineering diagnostic, not the canonical NGF objective.
  mask_only_Dice:
    scope: >-
      Base-level, primary-unshuffled, outline-invariant descriptive reference
      only; copy it once per base. It never enters an image score or gate and is
      not presented as a new bilinear-safe/core/context or common-lattice-
      shuffled Dice.
    source: >-
      Copy, never recompute under the new masks, the exact 40 float64 values at
      /scores/mask_only_Dice from each authenticated frozen
      primary/case-NNN.json. Those values used the frozen semantic target
      fixed_valid_mask and native-lattice target/candidate label rasters.
    frozen_formula: >-
      V=fixed_valid_mask; T=V AND target_labels!=0;
      Ck=V AND candidate_labels[k]!=0;
      Dk=(2*count(T AND Ck)+1e-12)/(count(T)+count(Ck)+1e-12), clipped to [0,1],
      in frozen ordered_candidate_ids order.
    per_case_receipt_keys:
      - "source_relative_path"
      - "source_file_sha256"
      - "source_case_payload_sha256"
      - "source_target_receipt_sha256"
      - "candidate_bank_id"
      - "ordered_candidate_ids_sha256"
      - "truth_candidate_id"
      - "source_vector_json_pointer"
      - "source_vector_sha256"
      - "scorer_source_sha256"
      - "runner_source_sha256"
      - "values"
      - "recomputed_ranking"
      - "entered_gate"
      - "payload_sha256"
    source_hashes:
      scorer_source_sha256: "4297e78a8a21785b570ad652af992d12363033ae3cc7dff324c549037e7aaf58"
      runner_source_sha256: "6c631fc0ebf99bd8b6b905e295d39ab060d0ffbd16c786c6f567dbc4520006e4"
    verification: >-
      Bind the raw frozen case-file hash and case payload, hash canonical
      {'mask_only_Dice':values}, verify candidate order/target/bank receipts,
      replay the frozen formula byte-exactly from regenerated labels/mask, and
      recompute ranking under the current frozen 1e-12 policy. Store under
      primary-case provenance, not across three outline descendants. Do not copy
      frozen shuffled Dice because it predates common-lattice resampling.
    role: "explicit silhouette-information reference"

insufficient_domain_contract:
  scope: >-
    Only ungated secondary descriptors or boundary-ring diagnostics may be
    insufficient. Primary MIND core/context insufficiency is always the
    prelaunch failure above. Never alter constants, impute a score, drop a base,
    or encode NaN/empty vectors.
  score_slot_union: >-
    Every scheduled descriptor/domain/outline/base/control slot is present and
    is either status='ok' with a 40-value score vector and ranking, or
    status='insufficient_domain' with scores=null, ranking=null and metrics=null.
  insufficient_record_keys:
    - "status"
    - "reason_code"
    - "case_index"
    - "bank_case_index"
    - "target_case_index"
    - "outline_mode"
    - "descriptor"
    - "domain"
    - "domain_mask_receipt_sha256"
    - "domain_pixel_count"
    - "eligible_pixel_count"
    - "eligible_block_count"
    - "scores"
    - "ranking"
    - "metrics"
    - "entered_gate"
    - "payload_sha256"
  fixed_values: >-
    reason_code is exactly NO_ELIGIBLE_PIXELS or NO_ELIGIBLE_BLOCKS; the
    corresponding eligible count is zero; scores, ranking and metrics are null;
    entered_gate=false. Nonapplicable index/count fields are JSON null.
  controls: >-
    Controls enumerate the same slots. A control whose source slot is
    insufficient emits status='authenticated_not_applicable', passed=null,
    reason_code='SOURCE_LANDSCAPE_INSUFFICIENT_DOMAIN' and binds the source null
    payload hash. Global integrity succeeds only when every control is
    passed=true or has this independently verified N/A record; N/A is never
    counted as a pass.
  aggregation: >-
    Secondary summaries report eligible_base_count and insufficient_base_count,
    aggregate eligible base units only, and never change a primary/gate
    denominator.

smart_brush_analysis:
  primary_requirement: >-
    The absent-outline/acquired-background context endpoint must pass. A method
    that works only after a perfect brush is not sufficient for optional-brush
    development. This establishes no-brush ranking only with oracle dewarping,
    visibility and ROI; it does not validate automatic slice extraction or
    full-canvas robustness on real acquired backgrounds.
  paired_reporting: >-
    Report within-base changes in top-1, rank and truth margin for accurate and
    imperfect black-exterior inputs relative to absent background. Keep the 64
    base realizations as the units; never treat 192 descendants as independent.
  expected_core_control: >-
    Accurate and absent inputs should agree on well-eroded visible tissue.
    Equality there does not show that brush is useless; its intended effect is
    external-background removal, measured only by context/ring diagnostics and
    later learned-model validation.
  compatibility_gate: >-
    Each black-exterior mode must meet its declared context top-1 threshold and
    may not trail absent-outline top-1 by more than 0.10.
  learned_model_implication: >-
    If the pilot passes, future training must randomize all three modes and
    retain the outline-availability flag only as an optional input indication,
    never substitute an automatic perfect mask when brush is absent.

score_schedule:
  outline_order:
    - "accurate-outline-black-exterior"
    - "imperfect-outline-black-exterior"
    - "absent-outline-acquired-background"
  native_unshuffled_per_base:
    descriptor_only_MIND:
      domains: ["core", "context"]
      outlines: "all three in outline_order"
      landscapes_per_base: 6
      decision_role: "primary; only the explicitly named slots below enter gates"
    constant_within_support_MIND_null:
      domains: ["core", "context"]
      outlines: "all three in outline_order"
      landscapes_per_base: 6
      decision_role: "only predeclared primary-minus-null safeguards enter gates"
    support_penalized_MIND_secondary:
      domains: ["core", "context"]
      outlines: "all three in outline_order"
      landscapes_per_base: 6
      decision_role: "descriptive only"
    HOG_secondary:
      domains: ["core", "context", "boundary_ring"]
      outlines: "all three in outline_order"
      landscapes_per_base: 9
      decision_role: "descriptive only; explicit null allowed"
    normalized_gradient_like_secondary:
      domains: ["core", "context", "boundary_ring"]
      outlines: "all three in outline_order"
      landscapes_per_base: 9
      decision_role: "descriptive only; explicit null allowed"
    mask_only_Dice:
      domains: ["frozen_semantic_fixed_valid_mask"]
      outlines: "none; one copied vector per base"
      landscapes_per_base: 1
      decision_role: "descriptive only"
    total_scheduled_slots_per_base: 37
  common_lattice_shuffled_per_bank_target_pair:
    descriptor_only_MIND:
      domains: ["core", "context"]
      outlines: "all three in outline_order"
      landscapes_per_pair: 6
      decision_role: "context slots enter the named shuffled gates; core is descriptive"
    constant_within_support_MIND_null:
      domains: ["core", "context"]
      outlines: "all three in outline_order"
      landscapes_per_pair: 6
      decision_role: "descriptive control only"
    excluded: >-
      No support-penalized MIND, HOG, normalized-gradient-like or mask-only Dice
      slot is scheduled for shuffled pairs.
    total_scheduled_slots_per_pair: 12
  gate_slot_exactness: >-
    Overall and orientation gates use native descriptor-only MIND,
    absent-outline context. The native core safeguard and both pooled safeguards
    use native descriptor-only MIND and its matching constant null,
    absent-outline core. Brush compatibility uses native descriptor-only MIND,
    each outline's context. Shuffled gates use shuffled descriptor-only MIND,
    each outline's context. No other slot enters a gate.
  completeness: >-
    Every listed slot must appear in its case sidecar in this order. No unlisted
    descriptor/domain/outline/native-or-shuffled combination may be computed,
    saved, aggregated or used for a decision without a new preflight.

control_schedule:
  every_computed_40_score_landscape:
    controls:
      - "candidate-order permutation equivariance"
      - "chunk sizes 1, 8 and 40 byte-identical"
    scope: >-
      Applies to every status='ok' native or shuffled MIND, MIND-null,
      support-penalized MIND, HOG and normalized-gradient-like scheduled slot.
      An insufficient secondary slot uses the authenticated-N/A contract.
  affine_and_polarity:
    base_cases: [0, 17, 37, 63]
    scope: >-
      Native slots only, all three outlines: descriptor-only MIND,
      constant-within-support MIND null and support-penalized MIND on core and
      context; HOG and normalized-gradient-like on core, context and
      boundary_ring. Mask-only and every shuffled slot are excluded.
  accurate_absent_core_identity:
    scope: >-
      Native descriptor-only MIND core landscapes only, every base; exact raw
      vector equality after inverse candidate-order canonicalization.
  shuffled_binding:
    scope: >-
      Every scheduled shuffled descriptor-only MIND and MIND-null slot must bind
      the exact +17 target, common-lattice maps, target masks/pitch and bank
      candidate receipts.
  copied_mask_only_verification:
    scope: "the one native base-level copied vector and receipt defined above"
  source_replay_metadata_and_geometry_controls:
    scope: "all 64 bases and every relevant source/input receipt"

ranking:
  candidates: >-
    Score all 40 without shortlist or reranking. Original banks use their native
    192x256 lattice; shuffled banks use the exact target-pitch common-lattice
    resampling before scoring.
  tie_tolerance: 1.0e-12
  tied_candidate_ids: >-
    Canonically sorted candidate IDs whose score s satisfies
    s>=max_score-1e-12.
  top1: "the tied-ID set is the singleton truth candidate ID"
  rank: >-
    One plus the number of decoys with score at least truth_score-1e-12.
  reciprocal_rank: "1.0 divided by the conservative rank"
  truth_versus_decoy_win_fraction: >-
    count of 39 decoys satisfying truth_score>decoy_score+1e-12, divided by 39.
  ties: >-
    Save the canonical sorted tied candidate-ID set. If more than one candidate
    is tied at maximum, selected candidate and pose errors are null and truth is
    not top-1. HOG/gradient may not resolve a MIND tie.
  saved_metrics:
    - "top-1, conservative rank, reciprocal rank and truth-vs-decoy win fraction"
    - "truth score and truth-minus-best-decoy margin"
    - "selected RP2 angle, sign-aligned offset, corresponding-point RMS and p95 errors"
    - >-
      raw 40-score vectors for every scheduled eligible image-descriptor/domain/
      outline/shuffled slot; insufficient secondary slots store null by contract,
      and base-only mask-only Dice is copied once rather than duplicated
  selected_pose_error_scope: >-
    Compute selected RP2 angle, sign-aligned offset and corresponding-point RMS/
    p95 only for native unshuffled descriptor-only MIND slots with a unique
    selected candidate. Compare with that base's frozen truth and evaluate point
    errors on the target visible mask using the frozen x/W,y/H physical contract.
    Set these fields null for ties and for every null, ablation, secondary,
    mask-only or shuffled landscape; shuffled ranks concern bank-i original truth
    and are not pose-error estimates relative to target j.
  aggregation:
    median: "numpy.median over the 64 base values; even counts average the two centre values"
    wilson_95:
      confidence: 0.95
      z: 1.959963984540054
      formula: >-
        With p=k/n, denominator=1+z^2/n, centre=(p+z^2/(2n))/denominator,
        half=z*sqrt(p*(1-p)/n+z^2/(4n^2))/denominator; report
        [centre-half,centre+half].

predeclared_go_gate:
  exact_integrity_controls: >-
    All applicable controls pass; only contract-permitted independently
    authenticated N/A records for insufficient secondary slots are accepted.
  primary_absent_context_MIND:
    top1_rate_minimum: 0.60
    wilson_95_lower_minimum: 0.45
    mean_reciprocal_rank_minimum: 0.70
    median_true_rank_maximum: 1
    median_true_versus_decoy_win_fraction_minimum: 0.90
    each_orientation_family_top1_minimum: 0.40
  absent_core_MIND_safeguard:
    top1_rate_minimum: 0.50
    mean_reciprocal_rank_minimum: 0.65
    top1_rate_advantage_over_constant_within_support_null_minimum: 0.10
  pooled_absent_core_MIND_safeguards:
    endpoint: >-
      Original unshuffled absent-outline descriptor-only MIND on the target-only
      core, with the matching constant-within-support-null landscape.
    challenging_appearance:
      frozen_base_count: 22
      top1_success_count_minimum: 7
      mean_reciprocal_rank_minimum: 0.45
      top1_success_count_advantage_over_null_minimum: 2
    damaged:
      frozen_base_count: 27
      top1_success_count_minimum: 9
      mean_reciprocal_rank_minimum: 0.45
      top1_success_count_advantage_over_null_minimum: 2
    interpretation: >-
      These score-blind catastrophic-stratum guards prevent the overall result
      being carried only by easy appearance or undamaged cases; they are not
      subgroup-performance or population-inference claims. Report each
      constituent appearance family, damage count and damage type descriptively
      without post-hoc gates.
  black_exterior_context_MIND:
    each_mode_top1_rate_minimum: 0.50
    maximum_top1_deficit_from_absent: 0.10
  shuffled_absent_context_MIND:
    original_truth_top1_rate_maximum: 0.10
    original_truth_mean_reciprocal_rank_maximum: 0.15
  shuffled_black_exterior_context_MIND:
    each_mode_original_truth_top1_rate_maximum: 0.10
    each_mode_original_truth_mean_reciprocal_rank_maximum: 0.15
  thresholds_interpretation: >-
    These are project development thresholds, not published clinical or
    biological standards. Chance top-1 is 1/40, but the correlated bank and the
    frozen shuffled-target control are more informative than that calculation.
  failure_action: >-
    Freeze the failure and diagnose synthesis, dewarping, mask, normalization or
    descriptor information. HOG or gradient performance cannot retroactively
    replace MIND; any follow-up needs a new preflight. Do not begin recurrent
    learned-model screening on this result alone.
  pass_action: >-
    Authorize a separately frozen, fresh randomly initialized joint
    pose/deformation architecture screen. Treat coarse-to-fine and recurrent
    designs as candidates selected for this problem, not legacy commitments.

mandatory_exact_controls:
  - "exact frozen parent, bank, order, candidate, descendant and dense-array replay"
  - "candidate scalar annotation and mask cross-check against every frozen candidate"
  - "fixed_to_source dewarp direction and bilinear-safe-mask construction"
  - >-
    Candidate-order permutation equivariance for every status-ok computed
    40-score landscape named in control_schedule using new slot k <- old slot
    (7*k+3) modulo 40; verify it is a nonidentity bijection, inverse-reindex raw
    vectors byte-exactly, and recompute ranks, ties and selected outputs. Copied
    mask-only Dice uses only its separate verification control.
  - "RP2 sign equivalence and x/W,y/H physical-coordinate contract"
  - "truth metadata, labels, poses, IDs, order and coordinate-channel exclusion from scorer source/signature"
  - "target masks and denominators invariant to candidate support/order"
  - >-
    Accurate-outline and absent-outline native descriptor-only core MIND raw
    40-score landscapes are byte-identical for every case; their inputs are
    identical over the complete eroded descriptor footprint.
  - "exact +17 shuffled target/bank binding"
  - >-
    On cases 0,17,37,63 in all outline modes, jointly transform the target and
    all 40 already-scaled candidate images over the complete raster with no
    clipping by J'=0.7J+0.1, J'=1.2J and J'=1-J. Apply the same transform to
    scalar-image padding only (0.1, 0 and 1 respectively); padding of derived
    squared-distance, gradient/histogram and Boolean-mask fields remains zero.
    MIND/HOG/gradient-like conservative ranks, top-1 values and canonical
    tied-ID sets must be exactly unchanged under the ordinary 1e-12 tie policy;
    this is a rank control, not a raw-score equality claim.
  - >-
    For every status-ok computed 40-score landscape named in control_schedule,
    chunk sizes exactly 1,8,40 yield byte-identical raw vectors; all scores are
    finite/in bounds and canonical tie handling is unchanged. Copied mask-only
    Dice is not chunk-computed.
  - "atomic sidecars, aggregate manifests and tamper rejection"

verification_and_outputs:
  output: "fresh build/arbitrary_plane_image_information_raw_<source-short-commit>"
  write_policy: "fail if output exists; atomic writes; never resume or repair in place"
  canonical_json: >-
    UTF-8 bytes from json.dumps with sort_keys=true, separators=(',',':'),
    allow_nan=false and no trailing newline. Payload hashes exclude only their
    own named SHA-256 field. Additional keys or files are forbidden.
  binary_masks: >-
    numpy.packbits over C-order Boolean flattening with bitorder='little'; bind
    dtype, H/W shape, bit count, byte count, relative path and payload SHA-256.
  dense_array_receipts: >-
    Convert numeric arrays to their dtype with explicit little byte order and C
    contiguity. Hash canonical JSON {dtype,shape} encoded UTF-8 immediately
    followed by C-order bytes, matching the frozen renderer's _array_sha256;
    use lowercase hex. Boolean array identities use canonical JSON
    {dtype:'|b1',shape,bitorder:'little'} immediately followed by C-order
    little-bitorder packbits. JSON score vectors are float64 values hashed as
    part of their enclosing canonical payload, never platform-native raw bytes.
  exact_tree:
    resolved_config.json: 1
    primary/case-NNN.json: 64
    shuffled/case-NNN.json: 64
    masks/case-NNN-map-safe.bin: 64
    masks/case-NNN-visible.bin: 64
    masks/case-NNN-core.bin: 64
    masks/case-NNN-context.bin: 64
    masks/case-NNN-boundary-ring.bin: 64
    controls/case-NNN.json: 64
    global_controls.json: 1
    result.json: 1
    total_files: 515
  exact_top_level_schemas:
    resolved_config.json:
      - "schema"
      - "preflight_sha256"
      - "repository"
      - "frozen_semantic_input"
      - "atlas_assets"
      - "descriptor_constants"
      - "case_and_shuffle_contract"
      - "environment"
      - "model_independence"
      - "data_access"
      - "source_sha256"
      - "resolved_config_sha256"
    primary/case-NNN.json:
      - "schema"
      - "case_index"
      - "semantic_case_payload_sha256"
      - "provenance"
      - "frozen_replay"
      - "target"
      - "candidate_bank"
      - "candidate_scalar_receipts"
      - "score_domains"
      - "outline_results"
      - "payload_sha256"
    shuffled/case-NNN.json:
      - "schema"
      - "bank_case_index"
      - "target_case_index"
      - "bank_identity"
      - "target_identity"
      - "common_lattice_resampling"
      - "score_domains"
      - "outline_results"
      - "payload_sha256"
    controls/case-NNN.json:
