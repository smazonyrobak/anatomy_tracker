independence:
  learned_checkpoint_dependencies: []
  previous_model_dependencies: []
  pretrained_feature_dependencies: []
  legacy_descriptor_dependencies: []
  initialization: "deterministic frozen case streams only; no learned initialization"
  prohibited:
    - "old checkpoints, learned features, pseudolabels or prior-model predictions"
    - "legacy GUI or dense-registration MIND implementations"
    - "selecting or combining descriptors after inspecting pilot scores"
    - "candidate metadata, pose, class, ID, order or coordinate channels entering a scorer"

literature_review:
  reviewed_on: "2026-09-01"
  conclusions:
    - >-
      MIND motivates a dense local self-similarity descriptor for nonlinear
      cross-modality intensity relationships, noise and bias fields.
    - >-
      TIRL directly supports an eight-component 2-D MIND representation,
      fixed-domain descriptor distances, masks and multiresolution search for
      stand-alone histology-to-volume registration.
    - >-
      Mouse-brain work by Xiong et al. supports HOG L2 scoring with larger cells
      for localization and smaller cells for deformation under uneven stain and
      modest distortion.
    - >-
      Normalized gradient fields motivate a separate polarity-insensitive
      structural diagnostic.
    - >-
      STAM reports that section angle affects anatomical interpretation and
      provides arbitrary-angle atlas reslicing; it does not validate the
      scoring choices or gates below.
  engineering_choices_not_literature_facts:
    - "the exact 100-um MIND displacement and 50-um Gaussian sigma"
    - "the 400-um HOG cell width and 100-um gradient smoothing"
    - "the 1000-um context ring and all numerical gates"
    - "MIND as the sole primary rather than a learned or combined descriptor"
  primary_sources:
    - "Heinrich MP et al. (2012), MIND, https://doi.org/10.1016/j.media.2012.05.008"
    - "Huszar IN et al. (2023), TIRL, https://doi.org/10.1016/j.neuroimage.2022.119792"
    - "Xiong J et al. (2018), mouse histology HOG mapping, https://doi.org/10.3389/fninf.2018.00093"
    - "Dalal N and Triggs B (2005), HOG, https://doi.org/10.1109/CVPR.2005.177"
    - "Haber E and Modersitzki J (2006), NGF, https://doi.org/10.1007/11866763_89"
    - "Feng Z et al. (2025), STAM, https://doi.org/10.1038/s41586-025-09211-8"

frozen_cases:
  statistical_unit: "base synthetic plane realization, never outline descendant or candidate pair"
  base_count: 64
  candidate_count_per_base: 40
  paired_outline_descendants_per_base: 3
  outline_modes:
    - "accurate-outline-black-exterior"
    - "imperfect-outline-black-exterior"
    - "absent-outline-acquired-background"
  orientation_counts:
    near_AP: 12
    near_DV: 12
    near_ML: 12
    general_oblique: 28
  pooled_safeguard_strata:
    challenging_appearance:
      membership: >-
        Accepted frozen G2 parameters.source_family is exactly
        label-conditioned or template-label-mixture.
      frozen_base_count: 22
    damaged:
      membership: "Accepted frozen G3 parameters.event_count >= 1."
      frozen_base_count: 27
      interpretation: >-
        This tests pose information retained in valid tissue after damage;
        privileged damage-validity masking means it is not a damaged-pixel
        detection or robustness claim.
    membership_contract: >-
      Derive and save canonically sorted base-case indices from authenticated
      accepted receipts before any image score. Count mismatch is an integrity
      failure. Evaluate pools independently; overlapping cases remain one base
      unit in each pool and are never duplicated within a pool.
  shuffled_mapping: "target case (i+17) modulo 64"
  shuffled_contract: >-
    For bank i and shifted target j=(i+17) modulo 64, target j owns the outline
    descendant, dewarped image, visible/core/context/ring masks and target pixel
    pitch. Before scoring, an authenticated control builder resamples each bank-i
    candidate about the x/W=0.5,y/H=0.5 canvas centre onto target j's physical
    pitch: source x=W/2+(x-W/2)*p_j/p_i and likewise for y, bilinear-zero for
    intensity and nearest-zero for the secondary support mask. The output remains
    192x256. Target pitch then governs every descriptor constant. Candidate pitch
    is used only by this hash-bound resampler outside the scorer; no pitch, pose
    or geometry metadata enters the scorer. Save p_i, p_j, the exact resampling
    map/hash and all target-j/bank-i receipts. Construct the source-coordinate
    map in float64 C order from stored float64 p_i,p_j. Resample already-scaled
    candidate float64 intensity with scipy.ndimage.map_coordinates, order=1,
    mode='constant', cval=0.0, prefilter=false. Resample the secondary support
    mask by np.rint ties-to-even followed by explicit bounds and nearest lookup,
    with out-of-bounds false. Pass continuous coordinates to map_coordinates as
    np.stack((source_y,source_x),axis=0). Candidate global scaling is unchanged.
  reuse_contract: >-
    Reconstruct only each accepted finite parent from its frozen accepted seed,
    then reconstruct its bank and three descendants. Require exact equality of
    every frozen parent, bank, order, candidate, truth, descendant, provenance
    and array receipt before scoring. Do not rerun rejection searches, replace a
    case, alter a bank, change order or tune a descriptor per case.
