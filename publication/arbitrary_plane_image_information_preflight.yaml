schema_version: "1.0"
receipt_id: "arbitrary-plane-image-information-preflight-2026-09-01"
date: "2026-09-01"
status: "development_protocol_frozen_execution_pending"
claim_scope: >-
  Predeclared small, model-free arbitrary-plane image-information pose-ranking
  pilot. It asks whether dewarped synthetic histology intensity can identify the
  exact plane within the already frozen 40-candidate banks. Exact deformation
  and visibility remain oracle inputs. This is not model training, architecture
  selection, uncertainty calibration, a real-histology or animal-level result,
  a DeepSlice comparison, qualification, final-test evaluation or a benchmark.

decision_basis:
  semantic_result: "publication/arbitrary_plane_semantic_oracle_result.yaml"
  semantic_result_checkout_sha256: "8adc2a97c4aacfcd0e91032b15cc475780cec8b8210ae0a4686ed90e697c9ac3"
  semantic_result_payload_sha256: "d60703b5d04cbc58e9e0060f020e82c43699c4c686bffc26171a44ea7ba90ad8"
  semantic_decision: "PASS for the narrow atlas-label premise"
  rationale: >-
    The semantic result clears the physical representation and finite-candidate
    premise but cannot establish that pixels contain the same information.
    This separately frozen pilot tests that missing premise before any learned
    recurrent or coarse-to-fine architecture is screened.

