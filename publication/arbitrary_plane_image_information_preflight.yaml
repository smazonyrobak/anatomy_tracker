    global_controls.json:
      - "schema"
      - "frozen_inventory_audit"
      - "source_and_signature_audit"
      - "affine_and_polarity_controls"
      - "evidence_receipt_sha256"
      - "payload_sha256"
    result.json:
      - "schema"
      - "interpretation"
      - "resolved_config_sha256"
      - "pre_result_inventory"
      - "pre_result_inventory_sha256"
      - "primary_case_payload_sha256"
      - "shuffled_case_payload_sha256"
      - "control_payload_sha256"
      - "metrics"
      - "gates"
      - "data_access"
      - "model_independence"
      - "result_payload_sha256"
  nested_schema_rule: >-
    New runner constants must enumerate the exact allowed/required keys for
    every nested record before execution; focused tests and the public verifier
    reject missing or additional keys, wrong types, nonfinite numbers, altered
    raw landscapes or inconsistent recomputed summaries.
  pre_result_inventory: >-
    result.json must bind the exact sorted {path,size_bytes,sha256} list and
    canonical payload digest for the other 514 files. The verifier rejects a
    missing, additional, stale or temporary file.
  mandatory_self_verification: >-
    After writing the final result, reload all files and independently recompute
    identities, hashes, scores, rankings, controls, metrics and gates before
    reporting success.
  public_post_exit_verifier: >-
    Rebuild Allen support from raw hash-checked assets, regenerate all frozen
    accepted cases/banks/descendants, rerender every scalar candidate and
    independently replay all primary and shuffled scores.
  save:
    - "exact source/config/preflight/environment hashes and every RNG lineage"
    - "animal/specimen/experiment identifiers including nulls"
    - "all parent, bank, candidate, outline, image, mask and scalar receipts"
    - "raw score vectors, normalization constants, domain counts and rankings"
    - "orientation, appearance, damage, support and outline strata"
    - >-
      copied and hash-bound frozen rejection records plus new pilot failures and
      exact-control evidence receipts; frozen rejection searches are never rerun
  reporting_interval: "one concise case milestone; inspect periodically rather than polling continuously"

limitations:
  - "Exact deformation and damage-validity truth are privileged."
  - "Synthetic observations originate from the same Allen template as candidates."
  - "The finite bank does not prove continuous global pose identifiability."
  - "Label-conditioned and template-mixture synthesis may preserve atlas-boundary information."
  - "Identity-appearance cases are easier and must be reported separately."
  - "Context performance may use silhouette/background; core and mask-only results must accompany it."
  - "No biological animal, public benchmark, external lab image or blinded expert is involved."

data_access:
  allen_template_and_annotation: true
  synthetic_development: true
  deepslice_ground_truth: false
  real_lab_histology: false
  calibration_animals: false
  qualification_animals: false
  final_test_animals: false
  full_benchmark: false

future_validation_plan_preserved:
  split_unit: "animal, never slice"
  untouched_final_test_animals_required: true
  development_data: "Allen and synthetic"
  public_benchmark: "DeepSlice Ground Truth dataset DOI 10.25949/22802411"
  external_validation: "separate real lab histology, ideally laboratory-held-out"
  comparators: "DeepSlice and relevant expert-assisted tools under matched conditions"
  reference: "blinded expert alignments"
  primary_metric: "physical anatomical landmark registration error"
  secondary_metrics: ["plane/angle error", "regional overlap", "failure rate", "correction time"]
  reporting: "animal-level effect sizes with 95% confidence intervals"
  reproducibility: "save exact splits, code, configs, seeds and raw predictions"
  probabilistic_outputs: >-
    Later calibrate plane/AP/tilt and dense uncertainty on unseen animals, test
    nominal credible-interval coverage and verify no loss of point accuracy,
    then propagate uncertainty into trajectory volumes and region assignments.
