implemented_contract:
  stage: "finite rendered geometry precursor"
  plane_orientation_measure: "orientation-balanced Haar-uniform RP2 normal; not Crofton plane measure"
  in_plane_roll_measure: "independent uniform [0,2pi)"
  reference_offset_measure: "length-uniform over the merged union of per-component support intervals"
  stress_stratum: "separately named boundary-stress bands"
  raster_aspect_policy: "isotropic physical pixel pitch with symmetric padding on the shorter axis"
  quicknii_pixel_mapping: "P(x,y)=O+(x/W)U+(y/H)V"
  scalar_sampling: "CPU torch.grid_sample trilinear, zero padding, align_corners=True"
  label_sampling: "native unsigned atlas indexing at torch.round coordinates, sampled output cast losslessly to int64, out-of-bounds zero"
  renderer_state: "effective float32 state and exact Allen/physical/QuickNII O/U/V, coordinate raster, normalized grid and validity mask are hash-bound"
  reflection_state: "explicitly false in precursor v1; reflection serialization is tested separately"
  split_scope: ["train", "development"]
  final_test_manifest_created_or_opened: false
  nullable_atlas_subject_ids: true
  exact_real_animal_specimen_experiment_ids_preserved_when_present: true
  complete_synthetic_realization_pending:
    - "deformation and exact forward/inverse maps"
    - "histology appearance and damage"
    - "accurate, imperfect and absent-outline smart-brush modes"
    - "moving images and complete masks"

prepared_context:
  schema: "anatomy-tracker.prepared-finite-render-context/v1"
  prepared_context_sha256: "04c387c1a778bfd0962cea972047b5eadc84f8cd2bce92ff74e9656f0af63b47"
  behavior: >-
    Atlas/support validation, finite checks, canonical conversion and hashes
    occur once. Later samples reuse owned tensors and frozen support without
    rescanning atlas arrays; tensor identity/version checks reject mutation.
  fixture_instrumentation: "two samples caused zero repeated atlas-volume hash calls and zero repeated support-index verification calls"
  trust_boundary: >-
    The raw scalar URI/SHA is authenticated by the trusted prepared context or
    an externally supplied raw file/digest. A self-contained artifact cannot
    authenticate caller-supplied raw bytes that were never provided.

