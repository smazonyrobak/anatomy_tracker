scientific_result:
  result: "GO for the finite arbitrary-plane rendering precursor"
  interpretation: >-
    The pinned Allen atlas produced nonempty, provenance-bound renders on
    near-AP, near-ML, near-DV and balanced extreme-oblique planes, including a
    named boundary-stress slice. All were accepted on attempt zero and one
    cached replay was exact. This establishes geometry/rendering feasibility,
    not pose identifiability or model accuracy.

limitations_and_next_step:
  limitations:
    - "The four-sample smoke is deliberately small and is not distributional validation."
    - "The finite precursor has no appearance, deformation, damage or smart-brush-mode realization."
    - "No wrong-plane candidate family or oracle pose-ranking premise has been tested on this v3 renderer."
    - "No model has been trained, selected, calibrated or benchmarked."
    - "No final-test animal, DeepSlice Ground Truth case or external lab histology was opened."
    - "Probabilistic pose and dense-map uncertainty remain planned, not implemented."
  next_step: >-
    Add complete deformation/appearance/damage and optional accurate,
    imperfect and absent-outline smart-brush modes with full
    synthetic_realization_id binding. Then run the small arbitrary-plane
    oracle ranking premise before implementing any recurrent joint model.
