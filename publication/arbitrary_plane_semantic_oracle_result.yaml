    state: "one resolved config file; no cases and no result"
    finding: >-
      The same implicit-null source-commit defect remained in the synthetic
      generator. It was corrected systematically and the directory was not
      resumed.
  - source_commit: "4a53a30"
    output: "build/arbitrary_plane_semantic_oracle_raw_4a53a30"
    state: "immutable 513-file pre-result tree; no result.json"
    finding: >-
      All 64 cases and 320 control sidecars passed, but the final score-domain
      gate rejected semantic truth scores of 1.0000000000000002 in cases 31,
      36 and 42. The theoretically bounded score families were clamped at the
      scorer boundary and a fresh run was started under commit 27c4ba6.
development_audit_trail_interpretation: >-
  These were fail-closed implementation findings, not altered scientific
  thresholds or post-hoc changes to the predeclared gate.

scientific_interpretation:
  supported_statement: >-
    Within this finite perturbation bank and exact deformation/visibility
    oracle, Allen annotation structure uniquely identifies the true physical
    arbitrary plane in all 64 synthetic development cases. The negative
    control and exact replay checks argue against target-independent truth
    preference, candidate-order leakage or coordinate-metadata leakage.
  limitations:
    - "Only 64 synthetic development realizations were used."
    - "The scorer sees exact categorical anatomy, not raw histological pixels."
    - "The candidate bank is finite; it does not prove global continuous-pose identifiability."
    - "Exact deformation and visibility are supplied to the oracle."
    - "No animal-level, public, external-lab or blinded-expert validation occurred."
    - "No learned point estimate or calibrated probability distribution was evaluated."

