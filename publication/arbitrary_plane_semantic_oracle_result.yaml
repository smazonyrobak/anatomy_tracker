claim_scope: >-
  Result of the frozen 64-case, model-free arbitrary-plane semantic
  pose-ranking development gate. This tests whether exact Allen annotation
  content can discriminate a finite bank of normal, offset and roll
  perturbations when deformation and visibility are known. It is not evidence
  that histological image appearance contains recoverable pose information,
  model training, architecture selection, uncertainty calibration, a real-data
  benchmark, qualification or final-test evaluation.

decision:
  gate: "PASS"
  supported: >-
    The arbitrary-plane physical representation, fixed-canvas candidate
    transport and Allen-label semantic premise cleared their predeclared gate
    across near-AP, near-DV, near-ML and general-oblique development strata.
  authorized_next_step: >-
    Freeze and run a separate small image-information pose-ranking pilot before
    screening a fresh randomly initialized joint pose/deformation model.
  not_authorized:
    - "claiming that synthetic or real image appearance supports pose recovery"
    - "selecting an architecture from this semantic result"
    - "training or reusing any previous learned model"
    - "uncertainty-calibration, benchmark, qualification or final-test claims"

