    recurrent designs as candidates, not inherited commitments, and do not use
    old checkpoints, learned features, pseudolabels or prior-model outputs.
  probabilistic_outputs: >-
    Preserve the later plan for calibrated plane/AP/tilt and deformation
    uncertainty, credible trajectory volumes and probabilistic region
    assignments, conditional on no material loss of point-estimate accuracy.

