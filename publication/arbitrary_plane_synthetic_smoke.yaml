scientific_result:
  decision: "GO_complete_generator_for_small_oracle_pose_ranking_development"
  supported_statement: >-
    The from-scratch generator now provides a deterministic, provenance-bound
    arbitrary brain-intersecting plane representation with topology-screened
    local deformation, broad procedural appearance, explicit observation
    damage and optional smart-brush views. Its narrow engineering contract is
    internally consistent on the tested synthetic fixtures.
  unsupported_statements:
    - "all arbitrary real histology planes are solved"
    - "the engineering distributions match biological prevalence"
    - "the generated images are perceptually realistic"
    - "a pose or deformation model has been trained or selected"
    - "point estimates or predictive intervals are accurate or calibrated"
    - "DeepSlice or any expert-assisted comparator has been benchmarked"
    - "final-test animals or qualification data have been evaluated"

